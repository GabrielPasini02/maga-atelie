<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#6FA3BD" />
<title>Painel · Maga Ateliê</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F8FAFB; --brand:#6FA3BD; --brand-dark:#557F96; --ink:#26323A;
    --card:#E8F1F5; --depth:#3F7D99; --line:rgba(38,50,58,.12); --muted:#5b6a73;
    --ok:#2e9e6b; --warn:#c4574c; --shadow:0 4px 20px rgba(38,50,58,.10); --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .mark{font-family:'Pinyon Script',cursive}

  /* ---- botões ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:1px solid transparent;border-radius:50px;
    padding:12px 20px;font-size:15px;font-weight:500;transition:.2s;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--depth)}
  .btn-danger{background:#fff;border-color:rgba(196,87,76,.4);color:var(--warn)}
  .btn-danger:hover{background:var(--warn);color:#fff;border-color:var(--warn)}
  .btn-block{width:100%}
  .btn:disabled{opacity:.55;cursor:default}

  /* ---- login ---- */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
    padding:36px 28px;width:100%;max-width:380px;text-align:center}
  .login-card .mark{font-size:44px;color:var(--ink);line-height:1}
  .login-card .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin:4px 0 26px}
  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--depth);margin-bottom:7px}
  .field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;font-size:16px;color:var(--ink);transition:.2s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(111,163,189,.16)}
  .field textarea{min-height:90px;resize:vertical}
  .msg{font-size:14px;margin-top:6px;min-height:20px}
  .msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}

  /* ---- topo ---- */
  header{position:sticky;top:0;z-index:20;background:rgba(248,250,251,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  header .mark{font-size:30px;line-height:1}
  header .who{font-size:12px;color:var(--muted)}
  .tabs{display:flex;gap:6px;padding:12px 16px 0;max-width:760px;margin:0 auto;width:100%}
  .tab{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;font-weight:500;color:var(--muted)}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:60px}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .bar h2{font-size:18px;font-weight:600}
  .count{font-size:12px;color:var(--muted)}

  /* ---- lista de vestidos ---- */
  .item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);
    padding:10px;margin-bottom:10px;box-shadow:var(--shadow)}
  .item.off{opacity:.6}
  .item .thumb{width:60px;height:76px;border-radius:9px;object-fit:cover;background:var(--card);flex:none}
  .item .meta{flex:1;min-width:0}
  .item .meta .nm{font-weight:600;font-size:15px}
  .item .meta .sb{font-size:12.5px;color:var(--muted)}
  .item .meta .pr{font-size:13px;color:var(--depth);margin-top:2px}
  .badge{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:50px;margin-left:6px}
  .badge.on{background:rgba(46,158,107,.14);color:var(--ok)}
  .badge.offb{background:rgba(196,87,76,.14);color:var(--warn)}
  .badge.dest{background:rgba(111,163,189,.18);color:var(--depth)}
  .item .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .iconbtn{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px}
  .iconbtn:hover{border-color:var(--brand);color:var(--depth)}
  .row-move{display:flex;gap:6px}
  .row-move .iconbtn{width:34px}
  /* busca + grupos por coleção */
  .busca{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:14px}
  .busca:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(111,163,189,.16)}
  .grupo{margin-bottom:12px}
  .grupo-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;color:var(--ink)}
  .grupo-head .gright{display:flex;align-items:center;gap:10px}
  .grupo-head .gcount{font-size:12px;font-weight:500;color:var(--depth);background:#fff;border:1px solid var(--line);border-radius:50px;padding:2px 10px}
  .grupo-head .gchev{color:var(--muted);transition:transform .2s;font-size:12px}
  .grupo.collapsed .gchev{transform:rotate(-90deg)}
  .grupo-corpo{padding-top:10px}
  .grupo.collapsed .grupo-corpo{display:none}
  /* preços */
  .bloco-label{display:block;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--depth);margin-bottom:8px}
  .mat-head{display:grid;grid-template-columns:1fr 80px 52px 26px;gap:8px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0 2px}
  .mat-row{display:grid;grid-template-columns:1fr 80px 52px 26px;gap:8px;align-items:center;margin-bottom:8px}
  .mat-row input{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 9px;font-size:14px;width:100%}
  .mat-row input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(111,163,189,.14)}
  .mat-row .rm{border:0;background:none;color:var(--warn);font-size:18px;cursor:pointer;padding:0}
  .resumo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:18px}
  .resumo .lin{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .resumo .lin span:first-child{color:var(--muted)}
  .resumo .lin.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600}
  .preco-venda{margin-top:12px;text-align:center;background:#fff;border-radius:12px;padding:14px}
  .preco-venda .k{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--depth)}
  .preco-venda .v{font-size:30px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:2px}
  .preco-venda .al{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ---- form de vestido (overlay) ---- */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(38,50,58,.45);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:94dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;padding-bottom:40px}
  @media(min-width:560px){.overlay{align-items:center}.sheet{border-radius:20px}}
  .sheet h3{font-size:19px;font-weight:600;margin-bottom:16px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fotos-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .foto-mini{position:relative;width:74px;height:92px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
  .foto-mini img{width:100%;height:100%;object-fit:cover}
  .foto-mini button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(38,50,58,.7);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
  .addfoto{width:74px;height:92px;border:1.5px dashed var(--brand);border-radius:9px;background:rgba(111,163,189,.06);color:var(--depth);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:3px}
  .addfoto svg{width:20px;height:20px}
  .sheet-actions{display:flex;gap:10px;margin-top:22px}
  .sheet-actions .btn{flex:1}
  .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .switch{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .switch input{width:20px;height:20px;accent-color:var(--brand)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
  .loading{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:50px;font-size:14px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="mark">Maga Ateliê</div>
    <div class="sub">painel · festa &amp; noiva</div>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" placeholder="seu@email.com" required />
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required />
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="btnLogin">Entrar</button>
    <div class="msg err" id="loginMsg"></div>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" hidden>
  <header>
    <div class="mark">Maga Ateliê</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" id="btnLogout" style="padding:8px 14px;font-size:13px">Sair</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="catalogo">Catálogo</button>
    <button class="tab" data-tab="precos">Preços</button>
    <button class="tab" data-tab="destaque">Destaque</button>
  </div>

  <main>
    <!-- CATÁLOGO -->
    <section id="tab-catalogo">
      <div class="bar">
        <div><h2>Catálogo</h2><div class="count" id="catCount"></div></div>
        <button class="btn btn-primary" id="btnAdd">+ Vestido</button>
      </div>
      <input type="search" id="busca" class="busca" placeholder="Buscar vestido pelo nome…" />
      <div id="lista"><div class="loading">Carregando…</div></div>
    </section>

    <!-- DESTAQUE -->
    <section id="tab-destaque" hidden>
      <div class="bar"><div><h2>Destaque da home</h2><div class="count">A "obra-prima" que aparece em cima no site</div></div></div>
      <div class="field">
        <label for="destSel">Vestido em destaque</label>
        <select id="destSel"></select>
      </div>
      <div class="field">
        <label for="destTitulo">Título (frase de impacto)</label>
        <input type="text" id="destTitulo" placeholder="O vestido que nasceu pra ser lembrado." />
      </div>
      <div class="field">
        <label for="destTexto">Texto</label>
        <textarea id="destTexto" placeholder="Conta um pouquinho sobre essa peça…"></textarea>
      </div>
      <button class="btn btn-primary btn-block" id="btnSalvarDest">Salvar destaque</button>
      <div class="msg ok" id="destMsg"></div>
    </section>

    <!-- PREÇOS -->
    <section id="tab-precos" hidden>
      <div class="bar"><div><h2>Preços</h2><div class="count">Calcula o preço como na sua planilha</div></div></div>

      <!-- configuração base (valor da hora) -->
      <div class="grupo collapsed" id="grupoCfg">
        <button type="button" class="grupo-head" onclick="this.parentElement.classList.toggle('collapsed')">
          <span>⚙️ Sua hora de trabalho</span>
          <span class="gright"><span class="gchev">▾</span></span>
        </button>
        <div class="grupo-corpo">
          <div class="field-row">
            <div class="field"><label>Pró-labore (R$/mês)</label><input type="number" id="cfgProLabore" inputmode="decimal" /></div>
            <div class="field"><label>Dias no mês</label><input type="number" id="cfgDias" inputmode="decimal" /></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Horas por dia</label><input type="number" id="cfgHoras" inputmode="decimal" /></div>
            <div class="field"><label>Custo fixo R$/mês (opc.)</label><input type="number" id="cfgCustoFixo" inputmode="decimal" /></div>
          </div>
          <div class="field"><label>Margem padrão (%)</label><input type="number" id="cfgMargem" inputmode="decimal" /></div>
          <div class="hint" id="cfgValorHora"></div>
          <button class="btn btn-primary btn-block" id="btnSalvarCfg">Salvar configuração</button>
          <div class="msg ok" id="cfgMsg"></div>
        </div>
      </div>

      <!-- calcular preço de um vestido -->
      <div class="field" style="margin-top:16px">
        <label for="precoVestido">Vestido pra precificar</label>
        <select id="precoVestido"></select>
      </div>

      <div id="precoBox">
        <label class="bloco-label">Materiais</label>
        <div id="materiaisLista"></div>
        <button type="button" class="btn btn-ghost btn-block" id="btnAddMaterial" style="margin-top:8px">+ Adicionar material</button>

        <div class="field-row" style="margin-top:16px">
          <div class="field"><label>Horas de trabalho</label><input type="number" id="precoHoras" inputmode="decimal" placeholder="ex: 16" /></div>
          <div class="field"><label>Margem (%)</label><input type="number" id="precoMargem" inputmode="decimal" placeholder="ex: 30" /></div>
        </div>

        <div class="resumo" id="precoResumo"></div>

        <div class="sheet-actions">
          <button type="button" class="btn btn-ghost" id="btnSalvarPreco">Salvar cálculo</button>
          <button type="button" class="btn btn-primary" id="btnUsarPreco">Usar como preço</button>
        </div>
        <div class="msg ok" id="precoMsg"></div>
      </div>
    </section>
  </main>
</div>

<!-- ===================== FORM DE VESTIDO ===================== -->
<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="formVestido">
    <h3 id="formTitulo">Novo vestido</h3>
    <input type="hidden" id="f-id" />
    <div class="field">
      <label for="f-nome">Nome</label>
      <input type="text" id="f-nome" placeholder="Ex: Jasmim" required />
    </div>
    <div class="field-row">
      <div class="field">
        <label for="f-colecao">Coleção</label>
        <select id="f-colecao"></select>
      </div>
      <div class="field">
        <label for="f-tag">Etiqueta (estilo)</label>
        <input type="text" id="f-tag" placeholder="Ex: Sereia" />
      </div>
    </div>
    <div class="field">
      <label for="f-preco">Preço de compra (R$)</label>
      <input type="number" id="f-preco" inputmode="numeric" min="0" step="50" placeholder="Ex: 2200" />
      <div class="hint">O aluguel é calculado sozinho (60% da compra).</div>
    </div>
    <div class="field">
      <label for="f-desc">Descrição</label>
      <textarea id="f-desc" placeholder="Uma frase curta sobre o vestido…"></textarea>
    </div>
    <div class="field">
      <label>Fotos</label>
      <div class="fotos-grid" id="fotosGrid"></div>
      <input type="file" id="f-fotos" accept="image/*" multiple hidden />
      <div class="hint">A 1ª foto é a capa. Toque numa foto pra remover.</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="f-ativo" checked />
      <span>Mostrar no site (ativo)</span>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn btn-ghost" id="btnCancelar">Cancelar</button>
      <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
    </div>
    <button type="button" class="btn btn-danger btn-block" id="btnExcluir" style="margin-top:10px;display:none">Excluir vestido</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script>
const COLECOES = ['Jardim','Maré','Brisa','Florescer','Estação','Destaque'];
const sb = window.sb;
const $ = id => document.getElementById(id);
const midia = f => !f ? '' : (/^https?:\/\//.test(f) ? f : '../' + f);
let VESTIDOS = [];

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function slugify(s){
  return (s||'vestido').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'vestido';
}

/* ---------------- AUTH ---------------- */
async function checkSession(){
  if(!sb){ $('loginMsg').textContent = 'Erro ao conectar. Recarregue a página.'; return; }
  const { data } = await sb.auth.getSession();
  if(data.session){ entrarApp(data.session.user); }
}
$('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('btnLogin'); btn.disabled=true; $('loginMsg').textContent='';
  const { data, error } = await sb.auth.signInWithPassword({ email:$('email').value.trim(), password:$('senha').value });
  btn.disabled=false;
  if(error){ $('loginMsg').textContent = traduzErro(error.message); return; }
  entrarApp(data.user);
});
$('btnLogout').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

function entrarApp(user){
  $('login').hidden = true;
  $('app').hidden = false;
  $('who').textContent = user.email;
  popularColecoesSelect();
  carregar();
}
function traduzErro(m){
  if(/Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m)) return 'E-mail ainda não confirmado.';
  return m;
}

/* ---------------- ABAS ---------------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  const tab=t.dataset.tab;
  $('tab-catalogo').hidden = tab!=='catalogo';
  $('tab-precos').hidden = tab!=='precos';
  $('tab-destaque').hidden = tab!=='destaque';
  if(tab==='destaque') carregarDestaque();
  if(tab==='precos') carregarPrecos();
}));

/* ---------------- CATÁLOGO ---------------- */
async function carregar(){
  $('lista').innerHTML = '<div class="loading">Carregando…</div>';
  const { data, error } = await sb.from('vestidos').select('*').order('ordem',{ascending:true});
  if(error){ $('lista').innerHTML = '<div class="empty">Erro ao carregar: '+error.message+'</div>'; return; }
  VESTIDOS = data||[];
  renderLista();
}
const colapsadas = new Set();
function renderLista(){
  $('catCount').textContent = VESTIDOS.length + ' vestido' + (VESTIDOS.length===1?'':'s');
  if(!VESTIDOS.length){ $('lista').innerHTML = '<div class="empty">Nenhum vestido ainda. Toque em <b>+ Vestido</b> pra adicionar.</div>'; return; }

  const termo = ($('busca').value||'').toLowerCase().trim();
  let lista = VESTIDOS;
  if(termo) lista = lista.filter(v => (v.nome||'').toLowerCase().includes(termo));

  // agrupa por coleção (na ordem certa)
  const grupos = {};
  lista.forEach(v => { (grupos[v.colecao] = grupos[v.colecao] || []).push(v); });
  const cols = ['Jardim','Maré','Brisa','Florescer','Estação','Destaque'].filter(c => grupos[c]);
  Object.keys(grupos).forEach(c => { if(!cols.includes(c)) cols.push(c); });

  if(!cols.length){ $('lista').innerHTML = '<div class="empty">Nenhum vestido encontrado.</div>'; return; }

  $('lista').innerHTML = cols.map(col => {
    const items = grupos[col];
    const off = (colapsadas.has(col) && !termo) ? ' collapsed' : '';
    const corpo = items.map((v,i)=>itemHTML(v,i,items.length)).join('');
    return ''
    + '<div class="grupo'+off+'">'
    +   '<button type="button" class="grupo-head" onclick="toggleGrupo(\''+escapeAttr(col)+'\',this)">'
    +     '<span>'+escapeHtml(col)+'</span>'
    +     '<span class="gright"><span class="gcount">'+items.length+'</span><span class="gchev">▾</span></span>'
    +   '</button>'
    +   '<div class="grupo-corpo">'+corpo+'</div>'
    + '</div>';
  }).join('');
}
function itemHTML(v, i, len){
  const capa = (v.fotos&&v.fotos[0]) ? midia(v.fotos[0]) : '';
  const aluguel = Math.round((v.preco||0)*0.6);
  return ''
  + '<div class="item'+(v.ativo?'':' off')+'">'
  +   (capa?'<img class="thumb" src="'+capa+'" alt="">':'<div class="thumb"></div>')
  +   '<div class="meta">'
  +     '<div class="nm">'+escapeHtml(v.nome)
  +        (v.ativo?'<span class="badge on">no ar</span>':'<span class="badge offb">oculto</span>')
  +        (v.colecao==='Destaque'?'<span class="badge dest">destaque</span>':'')
  +     '</div>'
  +     '<div class="sb">'+escapeHtml(v.colecao)+(v.tag?' · '+escapeHtml(v.tag):'')+'</div>'
  +     '<div class="pr">R$ '+Number(v.preco||0).toLocaleString('pt-BR')+' <span style="color:var(--muted)">· aluguel R$ '+aluguel.toLocaleString('pt-BR')+'</span></div>'
  +   '</div>'
  +   '<div class="acts">'
  +     '<button class="iconbtn" title="Editar" onclick="editar(\''+v.id+'\')">✎</button>'
  +     '<div class="row-move">'
  +       '<button class="iconbtn" title="Subir" onclick="mover(\''+v.id+'\',-1)"'+(i===0?' disabled':'')+'>▲</button>'
  +       '<button class="iconbtn" title="Descer" onclick="mover(\''+v.id+'\',1)"'+(i===len-1?' disabled':'')+'>▼</button>'
  +     '</div>'
  +   '</div>'
  + '</div>';
}
window.toggleGrupo = (col, btn)=>{
  if(colapsadas.has(col)) colapsadas.delete(col); else colapsadas.add(col);
  btn.parentElement.classList.toggle('collapsed');
};
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return String(s==null?'':s).replace(/'/g,"\\'"); }

/* ---------------- FORM DE VESTIDO ---------------- */
let fotosAtuais = [];   // mistura de URLs (existentes) e {file,preview} (novas)
function popularColecoesSelect(){
  const opts = COLECOES.map(c=>'<option value="'+c+'">'+(c==='Destaque'?'Destaque (fora do catálogo)':c)+'</option>').join('');
  $('f-colecao').innerHTML = opts;
}
$('btnAdd').addEventListener('click', ()=> abrirForm(null));
$('busca').addEventListener('input', ()=> renderLista());
window.editar = (id)=> abrirForm(VESTIDOS.find(v=>v.id===id));

function abrirForm(v){
  $('formTitulo').textContent = v ? 'Editar vestido' : 'Novo vestido';
  $('f-id').value = v ? v.id : '';
  $('f-nome').value = v ? v.nome : '';
  $('f-colecao').value = v ? v.colecao : 'Jardim';
  $('f-tag').value = v ? (v.tag||'') : '';
  $('f-preco').value = v ? (v.preco||'') : '';
  $('f-desc').value = v ? (v.descricao||'') : '';
  $('f-ativo').checked = v ? !!v.ativo : true;
  $('btnExcluir').style.display = v ? 'block' : 'none';
  fotosAtuais = v && Array.isArray(v.fotos) ? v.fotos.map(u=>({url:u})) : [];
  renderFotos();
  $('overlay').hidden = false;
}
function fecharForm(){ $('overlay').hidden = true; $('f-fotos').value=''; }
$('btnCancelar').addEventListener('click', fecharForm);
$('overlay').addEventListener('click',(e)=>{ if(e.target===$('overlay')) fecharForm(); });

function renderFotos(){
  const grid = $('fotosGrid');
  grid.innerHTML = fotosAtuais.map((f,i)=>{
    const src = f.url ? midia(f.url) : f.preview;
    return '<div class="foto-mini"><img src="'+src+'" alt=""><button type="button" onclick="removerFoto('+i+')">×</button></div>';
  }).join('')
  + '<button type="button" class="addfoto" id="addFotoBtn">'
  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Foto</button>';
  $('addFotoBtn').addEventListener('click', ()=> $('f-fotos').click());
}
window.removerFoto = (i)=>{ fotosAtuais.splice(i,1); renderFotos(); };
$('f-fotos').addEventListener('change',(e)=>{
  [...e.target.files].forEach(file=> fotosAtuais.push({ file, preview: URL.createObjectURL(file) }));
  e.target.value=''; renderFotos();
});

async function idUnico(base){
  let id = base, n = 2;
  const existentes = new Set(VESTIDOS.map(v=>v.id));
  while(existentes.has(id)){ id = base+'-'+n; n++; }
  return id;
}

$('formVestido').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=$('btnSalvar'); btn.disabled=true; btn.textContent='Salvando…';
  try{
    let id = $('f-id').value;
    const novo = !id;
    if(novo) id = await idUnico(slugify($('f-nome').value));

    // sobe as fotos novas pro Storage
    const fotosFinal = [];
    for(const f of fotosAtuais){
      if(f.url){ fotosFinal.push(f.url); continue; }
      const ext = (f.file.name.split('.').pop()||'jpg').toLowerCase();
      const path = id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
      const up = await sb.storage.from('vestidos').upload(path, f.file, { upsert:true, contentType:f.file.type });
      if(up.error) throw up.error;
      const { data:pub } = sb.storage.from('vestidos').getPublicUrl(path);
      fotosFinal.push(pub.publicUrl);
    }

    const registro = {
      id,
      nome: $('f-nome').value.trim(),
      colecao: $('f-colecao').value,
      tag: $('f-tag').value.trim() || null,
      preco: parseInt($('f-preco').value||'0',10) || 0,
      descricao: $('f-desc').value.trim() || null,
      fotos: fotosFinal,
      ativo: $('f-ativo').checked
    };
    if(novo){
      registro.ordem = (VESTIDOS.reduce((m,v)=>Math.max(m,v.ordem||0),0)) + 1;
      const { error } = await sb.from('vestidos').insert(registro);
      if(error) throw error;
    } else {
      const { error } = await sb.from('vestidos').update(registro).eq('id', id);
      if(error) throw error;
    }
    fecharForm();
    await carregar();
    toast(novo ? 'Vestido adicionado 🤍' : 'Vestido atualizado 🤍');
  }catch(err){
    alert('Não consegui salvar: ' + (err.message||err));
  }finally{
    btn.disabled=false; btn.textContent='Salvar';
  }
});

$('btnExcluir').addEventListener('click', async ()=>{
  const id = $('f-id').value;
  const v = VESTIDOS.find(x=>x.id===id);
  if(!confirm('Excluir "'+(v?v.nome:'')+'"? Isso não tem volta.')) return;
  const { error } = await sb.from('vestidos').delete().eq('id', id);
  if(error){ alert('Erro ao excluir: '+error.message); return; }
  fecharForm(); await carregar(); toast('Vestido excluído.');
});

/* ---------------- REORDENAR ---------------- */
window.mover = async (id, dir)=>{
  const v = VESTIDOS.find(x=>x.id===id);
  if(!v) return;
  // reordena DENTRO da coleção (a ordem que importa no site é dentro de cada coleção)
  const grupo = VESTIDOS.filter(x=>x.colecao===v.colecao);
  const i = grupo.findIndex(x=>x.id===id);
  const j = i+dir;
  if(j<0 || j>=grupo.length) return;
  const a = grupo[i], b = grupo[j];
  const oa = a.ordem, ob = b.ordem;
  a.ordem = ob; b.ordem = oa;
  VESTIDOS.sort((x,y)=>(x.ordem||0)-(y.ordem||0));
  renderLista();
  const r1 = await sb.from('vestidos').update({ordem:ob}).eq('id',a.id);
  const r2 = await sb.from('vestidos').update({ordem:oa}).eq('id',b.id);
  if(r1.error||r2.error){ toast('Erro ao reordenar'); carregar(); }
};

/* ---------------- DESTAQUE ---------------- */
async function carregarDestaque(){
  const { data:vs } = await sb.from('vestidos').select('id,nome,colecao').order('nome',{ascending:true});
  $('destSel').innerHTML = (vs||[]).map(v=>'<option value="'+v.id+'">'+escapeHtml(v.nome)+' ('+escapeHtml(v.colecao)+')</option>').join('');
  const { data:cfg } = await sb.from('config').select('*').eq('id',1).maybeSingle();
  if(cfg){
    if(cfg.destaque_id) $('destSel').value = cfg.destaque_id;
    $('destTitulo').value = cfg.destaque_titulo||'';
    $('destTexto').value = cfg.destaque_texto||'';
  }
}
$('btnSalvarDest').addEventListener('click', async ()=>{
  const btn=$('btnSalvarDest'); btn.disabled=true; $('destMsg').textContent='';
  const { error } = await sb.from('config').update({
    destaque_id: $('destSel').value,
    destaque_titulo: $('destTitulo').value.trim() || null,
    destaque_texto: $('destTexto').value.trim() || null,
    atualizado_em: new Date().toISOString()
  }).eq('id',1);
  btn.disabled=false;
  if(error){ $('destMsg').className='msg err'; $('destMsg').textContent='Erro: '+error.message; return; }
  $('destMsg').className='msg ok'; $('destMsg').textContent='Destaque salvo! Aparece no site em instantes 🤍';
  toast('Destaque salvo 🤍');
});

/* ---------------- PREÇOS ---------------- */
let precosCfg = { pro_labore:1500, dias_trabalhados:20, horas_dia:8, custo_fixo:0, margem_padrao:0.30 };
let materiais = [];
const MATERIAIS_PADRAO = [
  {nome:'Tecido', valor:0, qtd:1},
  {nome:'Entretela', valor:0, qtd:1},
  {nome:'Aviamentos (zíper, botões)', valor:0, qtd:1},
  {nome:'Acabamentos (anágua, véu)', valor:0, qtd:1}
];
function _baseHoras(){ return (+precosCfg.dias_trabalhados||1) * (+precosCfg.horas_dia||1); }
function valorHora(){ return (+precosCfg.pro_labore||0) / _baseHoras(); }
function valorHoraFixo(){ return (+precosCfg.custo_fixo||0) / _baseHoras(); }
function brl(n){ return 'R$ ' + (Math.round((+n||0)*100)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function brl0(n){ return 'R$ ' + Math.round(+n||0).toLocaleString('pt-BR'); }

async function carregarPrecos(){
  const { data:cfg } = await sb.from('precos_config').select('*').eq('id',1).maybeSingle();
  if(cfg) precosCfg = cfg;
  $('cfgProLabore').value = precosCfg.pro_labore;
  $('cfgDias').value = precosCfg.dias_trabalhados;
  $('cfgHoras').value = precosCfg.horas_dia;
  $('cfgCustoFixo').value = precosCfg.custo_fixo;
  $('cfgMargem').value = Math.round((precosCfg.margem_padrao||0)*100);
  mostrarValorHora();
  const { data:vs } = await sb.from('vestidos').select('id,nome,colecao').order('nome',{ascending:true});
  $('precoVestido').innerHTML = '<option value="">— escolha um vestido —</option>' +
    (vs||[]).map(v=>'<option value="'+v.id+'">'+escapeHtml(v.nome)+' ('+escapeHtml(v.colecao)+')</option>').join('');
  $('precoBox').style.display = 'none';
}
function mostrarValorHora(){
  const vh = valorHora(), vf = valorHoraFixo();
  $('cfgValorHora').innerHTML = 'Sua hora de trabalho: <b>'+brl(vh)+'</b>' + (vf>0 ? '  ·  custo fixo <b>'+brl(vf)+'</b>/h' : '');
}
function bindCfgInputs(){
  ['cfgProLabore','cfgDias','cfgHoras','cfgCustoFixo'].forEach(id=>$(id).addEventListener('input',()=>{
    precosCfg.pro_labore = +$('cfgProLabore').value||0;
    precosCfg.dias_trabalhados = +$('cfgDias').value||1;
    precosCfg.horas_dia = +$('cfgHoras').value||1;
    precosCfg.custo_fixo = +$('cfgCustoFixo').value||0;
    mostrarValorHora(); calcular();
  }));
  $('precoHoras').addEventListener('input', calcular);
  $('precoMargem').addEventListener('input', calcular);
}
$('btnSalvarCfg').addEventListener('click', async ()=>{
  const btn=$('btnSalvarCfg'); btn.disabled=true; $('cfgMsg').textContent='';
  const reg = {
    pro_labore:+$('cfgProLabore').value||0,
    dias_trabalhados:+$('cfgDias').value||1,
    horas_dia:+$('cfgHoras').value||1,
    custo_fixo:+$('cfgCustoFixo').value||0,
    margem_padrao:(+$('cfgMargem').value||0)/100,
    atualizado_em:new Date().toISOString()
  };
  const { error } = await sb.from('precos_config').update(reg).eq('id',1);
  btn.disabled=false;
  if(error){ $('cfgMsg').className='msg err'; $('cfgMsg').textContent='Erro: '+error.message; return; }
  precosCfg = Object.assign(precosCfg, reg);
  $('cfgMsg').className='msg ok'; $('cfgMsg').textContent='Configuração salva 🤍';
  mostrarValorHora(); calcular();
});

$('precoVestido').addEventListener('change', carregarPrecoVestido);
async function carregarPrecoVestido(){
  const id = $('precoVestido').value;
  if(!id){ $('precoBox').style.display='none'; return; }
  $('precoBox').style.display='block';
  $('precoMsg').textContent='';
  const { data:p } = await sb.from('precificacao').select('*').eq('vestido_id',id).maybeSingle();
  if(p && Array.isArray(p.materiais) && p.materiais.length){
    materiais = p.materiais.map(m=>({nome:m.nome||'',valor:+m.valor||0,qtd:+m.qtd||1}));
    $('precoHoras').value = p.horas||'';
    $('precoMargem').value = Math.round((p.margem!=null?p.margem:precosCfg.margem_padrao)*100);
  } else {
    materiais = MATERIAIS_PADRAO.map(m=>({...m}));
    $('precoHoras').value = '';
    $('precoMargem').value = Math.round((precosCfg.margem_padrao||0)*100);
  }
  renderMateriais(); calcular();
}
function renderMateriais(){
  $('materiaisLista').innerHTML =
    '<div class="mat-head"><span>Item</span><span>Valor R$</span><span>Qtd</span><span></span></div>'
    + materiais.map((m,i)=>
      '<div class="mat-row">'
      + '<input type="text" value="'+escapeHtml(m.nome)+'" oninput="matSet('+i+',\'nome\',this.value)" placeholder="Material">'
      + '<input type="number" inputmode="decimal" value="'+(m.valor||'')+'" oninput="matSet('+i+',\'valor\',this.value)" placeholder="0">'
      + '<input type="number" inputmode="decimal" value="'+(m.qtd||'')+'" oninput="matSet('+i+',\'qtd\',this.value)" placeholder="1">'
      + '<button type="button" class="rm" onclick="matDel('+i+')" aria-label="Remover">×</button>'
      + '</div>'
    ).join('');
}
window.matSet = (i,campo,val)=>{ materiais[i][campo] = (campo==='nome') ? val : (+val||0); calcular(); };
window.matDel = (i)=>{ materiais.splice(i,1); renderMateriais(); calcular(); };
$('btnAddMaterial').addEventListener('click', ()=>{ materiais.push({nome:'',valor:0,qtd:1}); renderMateriais(); });

function calcular(){
  const matTotal = materiais.reduce((s,m)=>s+(+m.valor||0)*(+m.qtd||0),0);
  const horas = +$('precoHoras').value||0;
  const maoObra = horas*valorHora();
  const custoFixo = horas*valorHoraFixo();
  const custo = matTotal + maoObra + custoFixo;
  const margem = (+$('precoMargem').value||0)/100;
  const venda = custo*(1+margem);
  const aluguel = Math.round(venda*0.6);
  $('precoResumo').innerHTML = ''
    + '<div class="lin"><span>Materiais</span><span>'+brl(matTotal)+'</span></div>'
    + '<div class="lin"><span>Mão de obra ('+(horas||0)+'h)</span><span>'+brl(maoObra)+'</span></div>'
    + (valorHoraFixo()>0 ? '<div class="lin"><span>Custo fixo</span><span>'+brl(custoFixo)+'</span></div>' : '')
    + '<div class="lin tot"><span>Custo do produto</span><span>'+brl(custo)+'</span></div>'
    + '<div class="preco-venda"><div class="k">Preço de venda ('+Math.round(margem*100)+'%)</div><div class="v">'+brl0(venda)+'</div><div class="al">Aluguel sugerido '+brl0(aluguel)+'</div></div>';
  return { custo, venda };
}
$('btnSalvarPreco').addEventListener('click', ()=> salvarPreco(false));
$('btnUsarPreco').addEventListener('click', ()=> salvarPreco(true));
async function salvarPreco(usar){
  const id = $('precoVestido').value;
  if(!id) return;
  const { custo, venda } = calcular();
  const reg = {
    vestido_id:id, materiais:materiais,
    horas:+$('precoHoras').value||0,
    margem:(+$('precoMargem').value||0)/100,
    custo_produto:Math.round(custo*100)/100,
    preco_sugerido:Math.round(venda),
    atualizado_em:new Date().toISOString()
  };
  $('precoMsg').textContent='';
  const { error } = await sb.from('precificacao').upsert(reg);
  if(error){ $('precoMsg').className='msg err'; $('precoMsg').textContent='Erro: '+error.message; return; }
  if(usar){
    const { error:e2 } = await sb.from('vestidos').update({preco:Math.round(venda)}).eq('id',id);
    if(e2){ $('precoMsg').className='msg err'; $('precoMsg').textContent='Cálculo salvo, mas erro ao aplicar no vestido: '+e2.message; return; }
    $('precoMsg').className='msg ok'; $('precoMsg').textContent='Preço '+brl0(venda)+' aplicado no vestido 🤍';
    toast('Preço aplicado: '+brl0(venda));
    carregar();
  } else {
    $('precoMsg').className='msg ok'; $('precoMsg').textContent='Cálculo salvo 🤍';
  }
}

/* ---------------- START ---------------- */
bindCfgInputs();
checkSession();
</script>
